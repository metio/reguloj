name: Release
on:
  schedule:
    - cron: 23 4 3 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@e00deed9d964457170bdfc81f03c2026abb4aad3 # main
    with:
      paths: src/main/java pom.xml
    secrets: inherit
