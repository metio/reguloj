name: Verify
on:
  merge_group:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  maven:
    name: Maven
    uses: metio/ci/.github/workflows/maven.yml@00adafd0fe1924f57325d9dd264d5d731fb099ad # 2026.11.4082509
  github-actions:
    name: github-actions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1
        with:
          fail_on_error: true
          filter_mode: nofilter
  verify:
    name: Verify
    needs: [maven, github-actions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
