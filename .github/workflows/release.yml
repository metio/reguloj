name: Release
on:
  schedule:
    - cron: 58 20 17 * *
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    uses: metio/ci/.github/workflows/maven-central-release.yml@6e8776dc59abdfffa793903f100e89f1aacb9c2e # 2026.11.2023135
    with:
      paths: src/main/java pom.xml
    secrets: inherit
